[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportlineage"
version = "0.1.0"
description = "Standalone SSRS/SSIS report-estate lineage: scanning, duplicate detection, and search, with zero dependency on any host application."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary, internal use" }
authors = [{ name = "Report Lineage Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2",
]

[project.optional-dependencies]
sqlparse = ["sqlglot>=20"]
server = ["requests>=2.28"]
all = ["sqlglot>=20", "requests>=2.28"]
dev = ["pytest>=7", "requests>=2.28", "sqlglot>=20"]

[project.scripts]
reportlineage = "reportlineage.cli:main"

[tool.setuptools.packages.find]
include = ["reportlineage*"]

[tool.setuptools.package-data]
reportlineage = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
